<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

<h1>💳 Payment</h1>

</select>

Calculate Bill

type="number"
id="paidAmount"
placeholder="Paid Amount">

<button id="saveBtn">
Save Payment
</button>

<br><br>

<button onclick="location.href='dashboard.html'">
⬅ Back
</button>

</div>

<script type="module" src="payment.js"></script>

</body>
