<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivasakthi Hotel Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="container">

    <div class="login-card">

        <h1>🏨 Sivasakthi Hotel</h1>

        <h3>Weekly Account Management</h3>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button id="loginBtn">
            Login
        </button>

        <p id="message"></p>

    </div>

</div>

<script type="module" src="../js/login.js"></script>

</body>
</html>
